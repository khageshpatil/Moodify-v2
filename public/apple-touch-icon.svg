<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="moodifyGradientApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glowApple">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded background -->
  <rect width="180" height="180" rx="40" fill="url(#moodifyGradientApple)"/>
  
  <!-- Musical Note (larger for Apple icon) -->
  <g filter="url(#glowApple)">
    <!-- Note stem -->
    <rect x="100" y="45" width="12" height="75" fill="white" rx="6"/>
    
    <!-- Note flag -->
    <path d="M 112 45 Q 140 52 140 70 Q 140 58 112 52 Z" fill="white"/>
    <path d="M 112 55 Q 135 60 135 75 Q 135 65 112 62 Z" fill="white" opacity="0.7"/>
    
    <!-- Note head -->
    <ellipse cx="93" cy="120" rx="22" ry="18" fill="white"/>
    
    <!-- Inner glow -->
    <ellipse cx="93" cy="120" rx="12" ry="10" fill="url(#moodifyGradientApple)" opacity="0.4"/>
  </g>
  
  <!-- Mood element - smile curve -->
  <path d="M 45 100 Q 65 115 85 100" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="60" r="6" fill="white" opacity="0.8"/>
  <circle cx="130" cy="110" r="5" fill="white" opacity="0.7"/>
  <circle cx="40" cy="130" r="4" fill="white" opacity="0.6"/>
  <circle cx="140" cy="50" r="4" fill="white" opacity="0.6"/>
  
  <!-- Sparkle stars -->
  <path d="M 60 140 L 62 144 L 66 143 L 64 147 L 68 149 L 64 151 L 62 155 L 60 151 L 56 149 L 60 147 L 58 143 Z" fill="white" opacity="0.7"/>
  <path d="M 150 130 L 151 133 L 154 132 L 152 135 L 155 137 L 152 139 L 151 142 L 150 139 L 147 137 L 150 135 L 148 132 Z" fill="white" opacity="0.6"/>
</svg>

