name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # With the signing secrets set, CI publishes the smaller, optimised release
      # build signed with the Moodify key; without them it falls back to debug.
      # Both talk to the live social server (debug builds otherwise expect one on the PC).
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.MOODIFY_KEYSTORE_BASE64 }}
          MOODIFY_KEYSTORE_PASSWORD: ${{ secrets.MOODIFY_KEYSTORE_PASSWORD }}
          MOODIFY_KEY_ALIAS: ${{ secrets.MOODIFY_KEY_ALIAS }}
          MOODIFY_KEY_PASSWORD: ${{ secrets.MOODIFY_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/moodify-release.jks"
            export MOODIFY_KEYSTORE_FILE="$RUNNER_TEMP/moodify-release.jks"
            ./gradlew :app:assembleRelease --no-daemon --stacktrace \
              -PversionCode=${{ github.run_number }} \
              -PversionName=1.1.${{ github.run_number }} \
              -PsocialBaseUrl=https://moodify-social.moodify-kp.workers.dev
            cp app/build/outputs/apk/release/app-release.apk ../Moodify.apk
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace \
              -PversionCode=${{ github.run_number }} \
              -PversionName=1.1.${{ github.run_number }} \
              -PsocialBaseUrl=https://moodify-social.moodify-kp.workers.dev
            cp app/build/outputs/apk/debug/app-debug.apk ../Moodify.apk
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.${{ github.run_number }}
          name: Moodify Android v1.1.${{ github.run_number }}
          generate_release_notes: true
          make_latest: true
          files: Moodify.apk
          fail_on_unmatched_files: true
