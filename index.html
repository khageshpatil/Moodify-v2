<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moodify</title>
    <meta name="description" content="Music with your closest friends: see what they're playing, send songs and listen together. No phone number or email." />
    <meta name="author" content="KP" />

    <!-- Moodify "Aura" type: Plus Jakarta Sans (same family as the Android app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Theme Colors -->
    <meta name="theme-color" content="#0B0B0F" />
    <meta name="msapplication-TileColor" content="#8b5cf6" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews (WhatsApp, SMS, socials). Absolute image URL: some apps ignore relative ones. -->
    <meta property="og:site_name" content="Moodify" />
    <meta property="og:title" content="Moodify" />
    <meta property="og:description" content="Music with your closest friends: see what they're playing, send songs and listen together. No phone number or email." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://moodify-v2-two.vercel.app/og-image.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="600" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Moodify" />
    <meta name="twitter:description" content="Music with your closest friends: see what they're playing, send songs and listen together. No phone number or email." />
    <meta name="twitter:image" content="https://moodify-v2-two.vercel.app/og-image.png" />
    
    <!-- GitHub Pages SPA redirect script -->
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
